# E2E 用の上書き。scripts/e2e.sh から次の形で使う（本番のデータ・volume・ポートに触れない）
#   docker compose -f compose.yaml -f compose.e2e.yaml -p local-llm-chat-e2e ...
services:
  ollama:
    # 偽 Ollama。image を上書きしないと、本番の ollama/ollama:<タグ> の名前で偽物がビルドされる
    build: ./e2e/mock-ollama
    image: local-llm-chat-e2e-mock-ollama
    # GPU の無い CI でも動かす
    gpus: !reset null
    mem_limit: !reset null
    healthcheck: !reset null
    volumes: !reset []
    # テストから /__mock/* を呼ぶための操作用ポート（E2E のみ）
    ports:
      - "127.0.0.1:11500:11434"

  frontend:
    ports: !override
      - "127.0.0.1:3100:3000"
    volumes: !override
      - e2e-data:/app/data
      - ./e2e/models.e2e.yaml:/app/models.yaml:ro
    # 利用者の .env に左右されないよう、テストが前提にする値はすべて上書きする
    environment:
      IDLE_TIMEOUT_SEC: "3"
      DISCOVERY_ENABLED: "false"
      DEFAULT_MODEL: gemma4:e4b
      NUM_CTX: "8192"
      CONTEXT_WARN_RATIO: "0.8"
      TIER_COMFORT_MAX_GB: "7"
      TIER_EXCLUDE_MIN_GB: "20"
      SESSION_LIMIT: "10"

volumes:
  e2e-data: {}
